<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="DashboardSummary.css">
    <title>Pathfinderr</title>  
</head>
<body>

<!-- Header / Navbar -->
<header class="navbar navbar-light bg-white sticky-top flex-md-nowrap p-0 shadow-sm">
  <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3" href="#">
    Student Dashboard
  </a>
  
  <div class="d-flex align-items-center ms-auto px-3 py-2">
      <button class="btn btn-link text-primary me-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSearch" aria-expanded="false" aria-controls="navbarSearch" title="Rechercher">
          <i class="bi bi-search fs-5"></i>
      </button>

      <button class="navbar-toggler d-md-none collapsed" 
              type="button" 
              data-bs-toggle="offcanvas" 
              data-bs-target="#sidebarMenu" 
              aria-controls="sidebarMenu" 
              aria-expanded="false" 
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
  </div>
</header>

<!-- BARRE DE RECHERCHE DÉPLIABLE -->
<div class="collapse" id="navbarSearch">
    <div class="container-fluid p-3">
        <div class="input-group">
            <!-- input field -->
            <input class="form-control" type="text" placeholder="Search..." aria-label="Search" id="searchInputField">
            
            <!-- valider -->
            <button class="btn btn-primary" type="button">
               🔍
            </button>
            
            <!-- close part -->
            <button class="btn btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSearch" title="Fermer">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </div>
</div>

<div class="container-fluid">
  <div class="row">
    
    <!-- SIDEBAR -->
    <div class="sidebar col-md-3 col-lg-2 p-0 bg-white offcanvas-md offcanvas-end" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
      
      <div class="offcanvas-header d-md-none">
        <h5 class="offcanvas-title" id="sidebarMenuLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu" aria-label="Close"></button>
      </div>

      <div class="offcanvas-body d-md-flex flex-column p-0 pt-lg-3 overflow-y-auto">
        <div class="position-sticky sidebar-sticky w-100">
            <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="DashboardSummary.html">
                <i class="bi bi-person-vcard"></i> Profile summary
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="DashboardSave.html">
                <i class="bi bi-bookmark-fill"></i> Save
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="DashboardApplied.html">
                <i class="bi bi-bank"></i> Applied
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="DashboardAccepted.html">
                <i class="fa fa-check"></i> Accepted
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                <i class="bi bi-ui-checks"></i> Application Tracking
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                <i class="bi bi-graph-up-arrow"></i> Recommended opportunities
                </a>
            </li>
            </ul>
            
            <hr class="my-3">

            <ul class="nav flex-column mb-2">
            <li class="nav-item">
                <a class="nav-link" href="index.html">
                <i class="bi bi-house"></i> Go to home page
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-danger" href="#">
                <i class="bi bi-box-arrow-left text-danger"></i> Sign out
                </a>
            </li>
            </ul>
        </div>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
      <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Profile summary</h1>
      </div>
        
      <div class="summary">
        <h4 id="user-name">Welcome to your dashboard, #Username</h4>

         <a href="ProfilePage.html" target="_blank" class="btn btn-outline-primary btn-sm fw-bold">
                <i class="fas fa-external-link-alt me-1"></i> Click here to view and edit your profile
            </a>
      </div>
    </main>
  </div>
</div>
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
